# Entorno de producción de Presto.
#
# Este archivo NO tiene ningún secreto: todo lo sensible llega por variables de
# entorno (archivo `.env.prod` o el orquestador). Los valores con `${VAR:-}` son
# solo defaults no sensibles.
#
# Modo demo: con DEMO_MODE=true la aplicación corre como demostración (el dinero
# es simulado y el backend de email es el de consola). Sin DEMO_MODE, el dinero
# simulado queda bloqueado por el system check ledger.E001.
#
# Antes de levantar:
#   1. crear un `.env.prod` con POSTGRES_PASSWORD, DJANGO_SECRET_KEY,
#      DJANGO_ALLOWED_HOSTS (y los opcionales DOMAIN, CORS_ALLOWED_ORIGINS)
#   2. `docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build`
#
# El backup diario de PostgreSQL es opcional: vive bajo el perfil `backup`
# (ver deploy/backup-postgres.sh, que también documenta cómo restaurar).
#
# El proxy inverso con TLS automático es opcional: vive bajo el perfil `proxy`
# (Caddy). Con el perfil activo es el único que publica puertos 80/443 y `web`
# queda solo en la red interna del compose. Sin el perfil, la plataforma debe
# llegar al contenedor de `web` por la red (si su plataforma exige un puerto
# publicado, agregá `ports: ["127.0.0.1:8000:8000"]` al servicio `web`).

services:
  db:
    # Imagen fijada a digest (ADR 0015): postgres 16.15. El tag solo informa
    # la versión; el digest es lo que garantiza el contenido.
    image: postgres:16.15@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-presto}
      POSTGRES_USER: ${POSTGRES_USER:-presto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    # Imagen fijada a digest (ADR 0015): redis 7.4.11-alpine.
    image: redis:7.4.11-alpine@sha256:892022f9f18c26c92c30e15194d132f90044af87b94a491a75429bbc3982eab1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    # The application never runs as root (audit M-3)
    user: presto
    command: >
      bash -c "export PYTHONPATH=/app &&
               python manage.py migrate --no-input &&
               gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-3}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-presto}:${POSTGRES_PASSWORD:-}@db:5432/${POSTGRES_DB:-presto}
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-}
      DJANGO_ENV: production
      DEMO_MODE: ${DEMO_MODE:-false}
      LEDGER_SIMULATED_DEPOSITS_ENABLED: ${LEDGER_SIMULATED_DEPOSITS_ENABLED:-false}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request as u;
          host = os.environ['DJANGO_ALLOWED_HOSTS'].split(',')[0].strip();
          print(u.urlopen(u.Request('http://127.0.0.1:8000/health/',
          headers={'X-Forwarded-Proto': 'https', 'Host': host})).read())
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build: .
    restart: unless-stopped
    # The application never runs as root (audit M-3)
    user: presto
    command: >
      bash -c "export PYTHONPATH=/app &&
               celery -A config worker -l info --concurrency ${CELERY_WORKER_CONCURRENCY:-2}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-presto}:${POSTGRES_PASSWORD:-}@db:5432/${POSTGRES_DB:-presto}
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-}
      DJANGO_ENV: production
      DEMO_MODE: ${DEMO_MODE:-false}
      LEDGER_SIMULATED_DEPOSITS_ENABLED: ${LEDGER_SIMULATED_DEPOSITS_ENABLED:-false}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}

  beat:
    build: .
    restart: unless-stopped
    # The application never runs as root (audit M-3)
    user: presto
    command: >
      bash -c "export PYTHONPATH=/app &&
               celery -A config beat -l info --schedule /var/celerybeat/celerybeat-schedule"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-presto}:${POSTGRES_PASSWORD:-}@db:5432/${POSTGRES_DB:-presto}
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-}
      DJANGO_ENV: production
      DEMO_MODE: ${DEMO_MODE:-false}
      LEDGER_SIMULATED_DEPOSITS_ENABLED: ${LEDGER_SIMULATED_DEPOSITS_ENABLED:-false}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    volumes:
      - celerybeat:/var/celerybeat

  backup:
    # Misma imagen fijada a digest que el servicio `db` (ADR 0015).
    image: postgres:16.15@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
    profiles: ["backup"]
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-presto}
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
      PGDATABASE: ${POSTGRES_DB:-presto}
      BACKUP_DIR: /backups
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ./deploy/backup-postgres.sh:/usr/local/bin/backup-postgres.sh:ro
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy
    command: >
      bash -c "while true; do
               /usr/local/bin/backup-postgres.sh && sleep 86400 || sleep 300; done"

  caddy:
    # Imagen fijada a digest (ADR 0015): caddy 2.11.7-alpine.
    image: caddy:2.11.7-alpine@sha256:24ec7b05bc532c7bb57f727030c5056e257ff7138b4b50460306819ff79362bd
    profiles: ["proxy"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  pg_data:
  celerybeat:
  caddy_data:
  caddy_config:
  backups:
