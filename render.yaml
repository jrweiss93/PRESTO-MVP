# Blueprint de Render para la demo de Presto.
#
# Crear en Render: New → Blueprint → elegir este repo. Render crea la base, el
# Redis y el web. El web NO construye la imagen: usa la que publica GitHub
# Actions en GHCR (ghcr.io/jrweiss93/presto-mvp:latest).
#
#   1. Hacé público el paquete en GitHub (Packages → presto-mvp → settings).
#   2. Completar CORS_ALLOWED_ORIGINS y FRONTEND_URL con la URL de Vercel
#      (ej. https://tu-app.vercel.app) en el web.
#   3. Completar las variables de email (EMAIL_HOST, EMAIL_PORT, etc.) con el
#      proveedor SMTP en el web; sin ellas los avisos salen por consola.
#   4. Worker y beat necesitan un plan pago (ver nota al final del archivo).
#   5. Superusuario: el plan free no tiene Shell. Usá
#      scripts/create-superuser-remote.ps1 con la External Database URL.
#
# Los planes `free` alcanzan para una demo (los servicios se duermen por
# inactividad). Si querés que no se duerman, cambiá el plan a `starter`.
# Ojo: la Postgres free de Render expira a los 30 días de crearla.

databases:
  - name: presto-db
    databaseName: presto
    user: presto
    plan: free

services:
  - type: redis
    name: presto-redis
    plan: free
    ipAllowList: []

  - type: web
    name: presto-api
    runtime: image
    image:
      url: ghcr.io/jrweiss93/presto-mvp:latest
    plan: free
    healthCheckPath: /health/
    initialDeployHook: python manage.py seed_demo
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: RUN_MIGRATIONS
        value: "1"
      - key: DJANGO_ALLOWED_HOSTS
        fromService:
          type: web
          name: presto-api
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: DATABASE_URL
        fromDatabase:
          name: presto-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: presto-redis
          property: connectionString
      - key: DEMO_MODE
        value: "true"
      - key: LEDGER_SIMULATED_DEPOSITS_ENABLED
        value: "true"
      - key: JWT_REFRESH_COOKIE_SAMESITE
        value: "None"
      - key: JWT_REFRESH_COOKIE_SECURE
        value: "true"
      - key: ASSISTANT_MARKET_ENABLED
        value: "true"
      - key: ASSISTANT_NEWS_FEED_URL
        value: https://www.ambito.com/rss/pages/economia.xml
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false

  # Worker y beat (Celery) requieren un plan pago: Render no ofrece instancia
  # free para background workers. Sin ellos no corren las tareas programadas
  # (marcar vencimientos y liquidar plazos fijos) ni el envío de emails.
  # Para habilitarlos, agregá dos servicios `type: worker` con esta misma
  # imagen, plan `0.5c-512mb` (aprox. US$7/mes cada uno) y:
  #   worker: dockerCommand: celery -A config worker -l info --concurrency 2
  #   beat:   dockerCommand: celery -A config beat -l info --schedule /var/celerybeat/celerybeat-schedule

