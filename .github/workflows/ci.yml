name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  POSTGRES_DB: presto
  POSTGRES_USER: presto
  POSTGRES_PASSWORD: presto
  POSTGRES_HOST: localhost
  POSTGRES_PORT: 5432
  DATABASE_URL: postgres://presto:presto@localhost:5432/presto
  DJANGO_SECRET_KEY: django-insecure-ci-key-do-not-use-in-prod
  DJANGO_DEBUG: "0"
  DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
  REDIS_URL: redis://localhost:6379/0
  DJANGO_SETTINGS_MODULE: config.settings.test

jobs:
  quality:
    name: Code Quality (ruff, import-linter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "Django>=6.1,<7" \
            "djangorestframework>=3.14" \
            "drf-spectacular>=0.30" \
            "djangorestframework-simplejwt>=5.3" \
            "pytest>=7.0" \
            "pytest-django>=4.0" \
            "pytest-cov>=5.0" \
            "factory-boy>=3.0" \
            "ruff>=0.1.0" \
            "import-linter>=2.0" \
            "psycopg[binary]>=3.2" \
            "python-dotenv>=1.0" \
            "argon2-cffi>=21.0.0" \
            "gunicorn>=22.0.0" \
            "celery>=5.3.0" \
            "redis>=5.0.0" \
            "dj-database-url>=2.2.0" \
            "django-cors-headers>=4.4" \
            "pip-audit>=2.7"

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

      - name: Run import-linter
        run: import-linter

      - name: Validate OpenAPI schema
        run: python manage.py spectacular --validate --fail-on-warn --file /tmp/schema.yml

      - name: Audit the dependencies for known vulnerabilities
        run: pip-audit .

      - name: Check the production settings (deploy check)
        run: |
          export DJANGO_SETTINGS_MODULE=config.settings.production
          export DJANGO_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(50))')"
          export DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1
          export DJANGO_DEBUG=0
          export REDIS_URL=redis://localhost:6379/0
          # La CI no es un despliegue: la revision legal se revisa en el equipo,
          # no en el pipeline. Reconocemos el recordatorio (`legal.W001`) para
          # no bloquear el pipeline; en cualquier entorno real el aviso sigue
          # activo hasta que el equipo lo revise.
          export LEGAL_REVIEW_ACKNOWLEDGED=true
          python manage.py check --deploy --fail-level WARNING

  migrations:
    name: Check Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "Django>=6.1,<7" \
            "djangorestframework>=3.14" \
            "drf-spectacular>=0.30" \
            "djangorestframework-simplejwt>=5.3" \
            "pytest>=7.0" \
            "pytest-django>=4.0" \
            "pytest-cov>=5.0" \
            "factory-boy>=3.0" \
            "ruff>=0.1.0" \
            "import-linter>=2.0" \
            "psycopg[binary]>=3.2" \
            "python-dotenv>=1.0" \
            "argon2-cffi>=21.0.0" \
            "gunicorn>=22.0.0" \
            "celery>=5.3.0" \
            "redis>=5.0.0" \
            "dj-database-url>=2.2.0" \
            "django-cors-headers>=4.4"

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

  tests:
    name: Tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "Django>=6.1,<7" \
            "djangorestframework>=3.14" \
            "drf-spectacular>=0.30" \
            "djangorestframework-simplejwt>=5.3" \
            "pytest>=7.0" \
            "pytest-django>=4.0" \
            "pytest-cov>=5.0" \
            "factory-boy>=3.0" \
            "ruff>=0.1.0" \
            "import-linter>=2.0" \
            "psycopg[binary]>=3.2" \
            "python-dotenv>=1.0" \
            "argon2-cffi>=21.0.0" \
            "gunicorn>=22.0.0" \
            "celery>=5.3.0" \
            "redis>=5.0.0" \
            "dj-database-url>=2.2.0" \
            "django-cors-headers>=4.4"

      - name: Run migrations
        run: python manage.py migrate

      - name: Run tests
        run: python -m pytest -v --cov=apps --cov-report=term-missing --cov-fail-under=80

      - name: Coverage gate for budgets services
        run: >
          python -m pytest apps/budgets
          --cov=apps.budgets.services
          --cov-report=term-missing
          --cov-fail-under=90

      - name: Coverage gate for the notifications app
        run: >
          python -m pytest apps/notifications
          --cov=apps.notifications.models
          --cov=apps.notifications.selectors
          --cov=apps.notifications.services
          --cov=apps.notifications.views
          --cov=apps.notifications.emails
          --cov=apps.notifications.tasks
          --cov=apps.notifications.receivers
          --cov-report=term-missing
          --cov-fail-under=90

      - name: Coverage gate for the reports app
        run: >
          python -m pytest apps/reports
          --cov=apps.reports.selectors
          --cov=apps.reports.views
          --cov=apps.reports.export
          --cov=apps.reports.serializers
          --cov=apps.reports.exceptions
          --cov-report=term-missing
          --cov-fail-under=90

  frontend:
    name: Frontend (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build